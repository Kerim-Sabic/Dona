name: dona_ai
description: Dona AI - The Ultimate Personal Assistant App inspired by Donna from Suits
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1

  # State Management
  provider: ^6.1.1
  flutter_bloc: ^8.1.3

  # API & Networking
  http: ^1.1.0
  dio: ^5.4.0

  # AI/LLM Integration
  # anthropic_sdk: # Will add when available
  # openai_api: ^2.0.0

  # Speech & Voice
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.5
  avatar_glow: ^3.0.1

  # Google APIs Integration
  googleapis: ^13.0.0
  googleapis_auth: ^1.5.0
  device_calendar: ^4.3.2

  # Twilio Integration
  twilio_flutter: ^0.0.9

  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location & Maps
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.3

  # Permissions
  permission_handler: ^11.2.0

  # Contacts & Phone
  contacts_service: ^0.6.3
  url_launcher: ^6.2.4

  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.2

  # Connectivity & Offline
  connectivity_plus: ^5.0.2

  # Path handling (cross-platform)
  path: ^1.8.3

  # Utilities
  uuid: ^4.3.3
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  logger: ^2.0.2+1
  timeago: ^3.6.0

  # Security
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
