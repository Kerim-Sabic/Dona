name: dona_ai
description: Dona AI - The Ultimate Personal Assistant App inspired by Donna from Suits
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management
  provider: ^6.1.2
  flutter_bloc: ^8.1.6

  # API & Networking
  http: ^1.2.0
  dio: ^5.4.3+1

  # Speech & Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  avatar_glow: ^3.0.1

  # Google APIs Integration
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  device_calendar: ^4.3.2

  # Twilio Integration
  twilio_flutter: ^0.0.9

  # Local Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location & Maps
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.6.1

  # Permissions
  permission_handler: ^11.3.1

  # Contacts & Phone
  contacts_service: ^0.6.3
  url_launcher: ^6.3.0

  # Notifications
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.2.1+2

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  logger: ^2.3.0
  timeago: ^3.6.1

  # Security
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # QR Code & Barcode
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

  # PDF Generation
  pdf: ^3.11.0
  printing: ^5.12.0

  # Image Processing
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Connectivity & Network
  connectivity_plus: ^6.0.3
  internet_connection_checker: ^1.0.0+1

  # Device Info
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # Share & File Operations
  share_plus: ^9.0.0
  open_file: ^3.3.2

  # Calendar & Time
  table_calendar: ^3.1.1
  flutter_datetime_picker_plus: ^2.2.0

  # Charts & Visualization
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^26.1.41

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
